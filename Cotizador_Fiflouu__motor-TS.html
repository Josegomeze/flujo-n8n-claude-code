<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Cotizador Fiflouu — motor TypeScript</title>
<style>
  :root{--verde:#16615f;--linea:#e1ebe9;--gris:#6b8088;--bg:#f4f7f6}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:#28323a}
  header{background:var(--verde);color:#fff;padding:16px 22px}
  header h1{margin:0;font-size:19px}
  header p{margin:4px 0 0;font-size:12px;opacity:.85}
  .wrap{max-width:1120px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:380px 1fr;gap:18px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:14px;color:var(--verde);border-bottom:1px solid var(--linea);padding-bottom:8px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--gris);margin-bottom:3px}
  .field input,.field select{width:100%;padding:7px 9px;border:1px solid #cdd8dc;border-radius:8px;font-size:14px;background:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:6px 0}
  .chk input{width:auto}
  .hide{display:none}
  table.res{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.res td{padding:5px 8px;border-bottom:1px solid #eef3f2}
  table.res td.v{text-align:right;font-weight:600}
  table.res tr.mayor td{background:#f0f7f6;color:var(--verde);font-weight:700}
  table.res tr.fin td{border-top:2px solid var(--verde);font-weight:700;font-size:15px}
  .letra{font-size:26px;color:var(--verde);font-weight:800;margin:2px 0 0}
  .sub{font-size:12px;color:var(--gris)}
  .tasas{margin-top:12px;font-size:11.5px;color:var(--gris)}
  .tasas span{display:inline-block;margin-right:12px}
  .badge{display:inline-block;background:#e8f3f1;color:var(--verde);border-radius:20px;padding:2px 10px;font-size:11px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>Cotizador Fiflouu <span class="badge">motor TypeScript</span></h1>
  <p>Cálculo nativo (sin hoja de cálculo) · verificado al centavo contra el modelo original</p>
</header>
<div class="wrap">
  <div class="card">
    <h2>Datos de la cotización</h2>
    <div class="field">
      <label>Modo</label>
      <select id="modo">

      </select>
    </div>
    <div class="field" id="f_monto"><label>Monto solicitado ($)</label><input id="monto" type="number" value="5000" step="100"></div>
    <div class="field hide" id="f_letra"><label>Letra quincenal ($)</label><input id="letra" type="number" value="150" step="1"></div>
    <div class="row2">
      <div class="field"><label>Plazo (cuotas)</label><input id="plazo" type="number" value="36"></div>
      <div class="field"><label>Tipo de cliente</label><select id="tipo"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Promotor</label><select id="prom">
        <option value="1">Completo</option><option value="2">Media</option><option value="3">Baja</option>
        <option value="4">Sin Comisión</option><option value="5">Referido $100</option></select></div>
      <div class="field"><label>Clave de descuento</label><select id="clave">
        <option value="G8">Empresa Privada</option><option value="G9">Jubilado</option>

        <option value="G12">Descuento Voluntario</option></select></div>
    </div>

    <div class="chk"><input id="af1" type="checkbox"><label for="af1">ITBMS fuera de interés y comisión</label></div>
    <div class="chk"><input id="af10" type="checkbox"><label for="af10">Interés compuesto (en vez de plano)</label></div>
    <div class="row2">
      <div class="field"><label>Refinanciamiento ($)</label><input id="refi" type="number" value="0"></div>
      <div class="field"><label>Cancelación terceros ($)</label><input id="terceros" type="number" value="0"></div>
    </div>
    <div class="chk"><input id="jub" type="checkbox" checked><label for="jub">Aplica tope por jubilación</label></div>
    <div class="row2" id="f_jub">
      <div class="field"><label>Fecha de nacimiento</label><input id="fnac" type="date" value="1990-01-15"></div>
      <div class="field"><label>Género</label><select id="genero"><option>Masculino</option><option>Femenino</option></select></div>
    </div>
    <div id="f_cliente" class="hide">

      <div class="row2">
        <div class="field"><label>Salario mensual ($)</label><input id="c_sal" type="number" value="1500"></div>
        <div class="field"><label>Descuentos comercial ($)</label><input id="c_desc" type="number" value="100"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Clave N-147 ($)</label><input id="c_n147" type="number" value="0"></div>
        <div class="field"><label>Embargos ($)</label><input id="c_emb" type="number" value="0"></div>
      </div>
      <div class="field"><label>Descontable mensual ($)</label><input id="c_descontable" type="number" value="1200"></div>
    </div>
  </div>

  <div class="card">
    <h2>Resultado</h2>
    <div class="sub">Letra quincenal</div>
    <div class="letra" id="r_letra">—</div>
    <div class="sub" id="r_cuotas"></div>
    <table class="res" id="r_tabla"></table>
    <div class="tasas" id="r_tasas"></div>
  </div>
</div>

<script type="module">
// ======================= MOTOR (TypeScript sin tipos) =======================
// Motor de cotización en TypeScript — reimplementación del cálculo de la hoja
// (camino por MONTO). Sustituye a las fórmulas de HyperFormula por código tipado
// y probado. Ver README.md para el alcance cubierto por esta prueba de concepto.

// ---------- Redondeo estilo Excel / HyperFormula ----------
// Excel/HyperFormula redondean "mitad hacia afuera" (away from zero) sobre el mismo
// double IEEE-754 que ve el motor. Operamos sobre |x|·10^d directamente (sin epsilon):
// coincide con HyperFormula en los bordes probados (1272.265 -> 1272.27; 25.9249999… -> 25.92).
function xround(x        , d        )         {   // mitad hacia afuera
  if (!isFinite(x)) return x;
  const f = Math.pow(10, d);
  return Math.sign(x) * Math.floor(Math.abs(x) * f + 0.5) / f;
}
function xrounddown(x        , d        )         { // hacia cero
  const f = Math.pow(10, d);
  return Math.sign(x) * Math.floor(Math.abs(x) * f) / f;
}
function xroundup(x        , d        )         {   // alejándose de cero
  const f = Math.pow(10, d);
  return Math.sign(x) * Math.ceil(Math.abs(x) * f) / f;
}
function xtrunc(x        , d        )         {     // hacia cero
  const f = Math.pow(10, d);
  return Math.sign(x) * Math.floor(Math.abs(x) * f) / f;
}

// ---------- Tipos ----------
                                                           

                                   
                                                                                                          
                                         
                                                                   
                                               
                                                
                                               
                                             
                                                                         
                                                             
                                                                                   
    
                                                                            
                                                                                
                                
                               
                                   
               
                                          
                                   
                                   
 

                             
                                                    
                                                    
                                             
                                   
                                                        
                                                                               
                                                        
                                                                               
                                  
                                  
                                  
                                                                        
                                                                             
                                                                                 
                                                                    
                                          
                                                                  
 

                              
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                  
                                                 
                                          
                                    
                                    
                                    
              
              
               
 

// CHOOSE(J2, fila1..fila6, fallback7): los tipos 1..6 toman su fila; el tipo 7 usa el
// 7º argumento del CHOOSE, que en la hoja es un literal (interés/gasto cierre) o la
// fila 6 (comisión). fallback7 = número literal o 'row6'.
function chooseTipo(mat            , tipoCode        , promCol        , fallback7                 )         {
  if (tipoCode <= 6) return mat[tipoCode - 1][promCol];
  return fallback7 === 'row6' ? mat[5][promCol] : fallback7;
}

// Tasas y cuotas resueltas (comunes a ambos caminos, monto y letra).
                 
                          
                                            
                                              
                                              
                                     
                                    
                                 
                                  
                                  
                                   
                                              
                                      
 

// G14 — cuotas efectivas: plazo solicitado, topado por jubilación (meses hasta pensión)
// y por el máximo por tipo/pago-automático (G15).
function calcCuotas(inp            , cfg                  , montoParaG15        )         {
  const tipoMax = cfg.tipoMaxPlazo[inp.tipoCode - 1];
  const G15 = inp.clave === 'G11' ? (inp.esCSS ? 60 : 72) : (montoParaG15 > 4000 ? 300 : tipoMax);
  let base = inp.plazo;
  if (cfg.jubilaAplica) {
    const retAge = inp.genero === 'Femenino' ? cfg.edadJubMujer : cfg.edadJubHombre;
    const I5 = (inp.fnacSerial ?? 0) + retAge * 365.25;                // fecha de jubilación (serial)
    const I6 = (I5 - (inp.todaySerial ?? 0)) / 365.25 * 12;            // meses hasta pensión
    base = Math.min(Math.trunc(I6), inp.plazo);                        // TRUNC(I6,0)
  }
  return Math.min(base, G15);
}

// montoParaG15: valor de D2 que ve G15 (= monto en camino por monto; 0 en camino por letra).
function resolverTasas(inp            , cfg                  , montoParaG15        )        {
  const promCol = inp.promotorIdx - 1;
  const cuotas = calcCuotas(inp, cfg, montoParaG15);

  // Clave Voluntario (G12) usa las matrices de la variante (S94/S102/S110).
  const vol = inp.clave === 'G12';
  const mComision = vol ? cfg.matrizComisionVol : cfg.matrizComision;
  const mInteres = vol ? cfg.matrizInteresVol : cfg.matrizInteres;
  const mGasto = vol ? cfg.matrizGastoCierreVol : cfg.matrizGastoCierre;

  const Y16 = chooseTipo(mInteres, inp.tipoCode, promCol, 0.02);
  const H25 = chooseTipo(mGasto, inp.tipoCode, promCol, 0.25);
  const S45 = chooseTipo(mComision, inp.tipoCode, promCol, 'row6');
  const H26 = (inp.promotorNoTiene ? 0 : S45) * (Math.min(cuotas, cfg.amCap) / cuotas);
  const H27 = servicioRate(inp, cfg);
  const H28 = cfg.timbresRate;
  const H31 = cfg.feciRate;
  const H20 = cfg.itbmsRate;
  const H14 = cuotas / 12 + cuotas;
  // AF11: interés plano (AF10=0) o compuesto (AF10=1)
  const AF11 = inp.interesCompuesto
    ? (Y16 * H14) / (1 - Math.pow(1 + Y16, -H14)) - 1
    : Y16 * H14;
  return {
    cuotas, Y16, H25, H26, H27, H28, H31, H20,
    H32: H26 + H27 + H28, H14, AF11,
    AB19: inp.promotorIdx === 5 ? 100 : 0,
  };
}

// Renglones desde la obligación P7 (idéntico en ambos caminos; AF1 = 0, ITBMS dentro).
function lineasDesdeP7(P7        , t       , inp            , cfg                  )              {
  const refi = inp.refi ?? 0, terceros = inp.terceros ?? 0, tercerosM = inp.tercerosM ?? 0;
  const { cuotas, Y16, H25, H26, H27, H28, H31, H20, H32, H14, AF11, AB19 } = t;

  const itbmsFuera = inp.itbmsFuera ?? false;
  const F16 = xround(P7, 2) - refi - terceros;                           // suma a recibir
  const F17 = refi, F18 = terceros, F19 = xround(tercerosM, 2);
  const F20 = itbmsFuera                                                 // ITBMS
    ? xround((F16 + F17 + F18 + F19) * H25 * H20, 2)
    : xround((((F16 + F17 + F19 + F18) / (1 - (H20 * H25))) * H25) * H20, 2);
  const G21 = itbmsFuera                                                 // monto obligación neta
    ? (F16 + F17 + F18 + F19)
    : (F16 + F17 + F18 + F19 + F20);
  const F23 = xrounddown(AF11 * G21, 2);                                 // intereses
  const F25 = xround(G21 * H25, 2);                                      // comisión administrativa
  const F30 = cfg.notaria;                                               // notaría
  const F31 = xround(G21 > 5000 ? G21 * H31 * ((H14 * 30) / 360) : 0, 2);// FECI

  const sumF16F25 = F16 + F17 + F18 + F19 + F20 + F23 + F25;
  const H33 = (sumF16F25 - (itbmsFuera ? F20 : 0) + F30 + F31 + AB19) / (1 - H32); // I33 = F34 = 0
  const F26 = xround(H33 * H26, 2) + 2 * AB19;                           // comisión promotor
  const F27 = xround(H33 * H27, 2);                                      // servicio de descuento
  const F28 = xroundup(H33 * H28, 1);                                    // timbres

  const G33 = F16 + F17 + F18 + F19 + F20 + F23 + F25 + F26 + F27 + F28 + F30 + F31; // total a pagar
  const C24 = xtrunc(xround(G33 / cuotas / 2, 2), 2);                    // letra quincenal

  return {
    cuotas, sumaARecibir: F16, itbms: F20, interes: F23, comisionAdmin: F25,
    comisionPromotor: F26, servicioDescuento: F27, timbres: F28, notaria: F30,
    feci: F31, montoNeta: G21, totalPagar: G33, letraQuincenal: C24,
    tasaInteresMensual: Y16, tasaComAdmin: H25, tasaComPromotor: H26, tasaServicio: H27,
    H32, H33, AF11,
  };
}

// Camino por MONTO: la obligación P7 = D2 (el monto solicitado).
function cotizarPorMonto(inp            , cfg                  )              {
  const monto = inp.monto ?? 0;
  const t = resolverTasas(inp, cfg, monto);
  return lineasDesdeP7(monto, t, inp, cfg);
}

// Camino por LETRA: se hace "gross-up" (M10) desde la letra quincenal deseada hasta la
// obligación, y luego se calculan los renglones igual que en el camino por monto.
function cotizarPorLetra(inp            , cfg                  )              {
  const letra = inp.letra ?? 0;
  const itbmsFuera = inp.itbmsFuera ?? false;
  const t = resolverTasas(inp, cfg, 0);                     // en camino por letra, D2 = 0 en G15
  const afTerm = itbmsFuera ? t.H25 * t.H20 * (1 - t.H32) : 0; // término AF1 del denominador
  const A = letra * t.cuotas * 2 * (1 - t.H32) - cfg.notaria - t.AB19; // total a pagar objetivo, neto
  const B1 = 1 + t.AF11 + t.H25 + afTerm;                   // sin FECI (obligación ≤ 5000)
  const B2 = 1 + t.AF11 + t.H25 + t.H31 * ((t.H14 * 30) / 360) + afTerm; // con FECI (obligación > 5000)
  const M10 = (A / B1 > 5000) ? A / B2 : A / B1;
  const M9 = M10 * t.H25 * t.H20;                           // M9 = M10·Y18·H20
  const P7 = itbmsFuera ? M10 : M10 - M9;                   // M7 = AF1 ? M10-M8 : M10-M8-M9 (M8=0)
  return lineasDesdeP7(P7, t, inp, cfg);
}

// F11 — Tope de letra quincenal por salario en Pago Automático (clave G11).
// esCSS = institución "Caja de Seguro Social" (tabla CSS); si no, tabla Contraloría.
function topeLetraPagoAuto(salario        , esCSS         )         {
  if (esCSS) {
    if (salario > 1500) return 45;
    if (salario > 1000) return 35;
    if (salario > 800) return 25;
    if (salario > 700) return 20;
    if (salario > 499.99) return 15;
    return 0;
  }
  if (salario > 2500) return 99;
  if (salario > 2400) return 95;
  if (salario > 2200) return 90;
  if (salario > 2000) return 85;
  if (salario > 1900) return 75;
  if (salario > 1700) return 70;
  if (salario > 1500) return 65;
  if (salario > 1400) return 60;
  if (salario > 1200) return 55;
  if (salario > 1000) return 50;
  if (salario > 750) return 45;
  if (salario > 499.99) return 35;
  return 0;
}

// Datos financieros crudos del cliente (columnas de DATOS).
                             
                                     
                                     
                                     
                                     
                                     
 

// Capacidad quincenal máxima del cliente (J13 sin redondear, J14 = ROUNDDOWN(J13,2)).
// El camino "por capacidad" (N7) equivale al camino por letra con letra = J13.
function capacidadQuincenal(
  fin            , clave          , esCSS         ,
)                               {
  const { salario: F2, descComercial: F3, claveN147: F4, embargos: F5, descontable: F6 } = fin;
  const N4 = 5, N6 = 0.74;
  const F8 = xround(Math.max(0, (F2 * 0.2 - F3) / 2), 2);
  const F9 = xround(Math.max(0, (F2 * 0.46625 - F3) / 2), 2);
  const F11 = topeLetraPagoAuto(F2, esCSS);
  const F12 = xrounddown((F2 - 600) * 0.15 / 2, 2);
  const G5 = xrounddown((F2 - 100) * 0.15, 2) - F5;
  const G6 = F5 > 0 ? (G5 > 0 ? F6 - (xround((F2 - 100) * 0.15, 2) - F5) : F6) : F6;

  const H8 = clave === 'G8' ? F8 : 0;
  const H9 = clave === 'G9' ? F9 : 0;
  const H10 = xtrunc(clave === 'G10'
    ? (F5 > 0 ? xrounddown(Math.max(0, (F2 * 0.2 - F3) / 2), 2)
              : xrounddown(Math.max(0, (F2 * 0.35 - F3) / 2), 2))
    : 0, 2);
  const H11 = clave === 'G11' ? (F4 > 0 ? 0 : F11) : 0;
  const H12 = clave === 'G12' ? (F5 > 0 ? 0 : F12) : 0;

  const capHalf = (G6 - F2 * 0.5) / 2;   // (G6 - F2·0.5)/2  (I8)
  const cap25 = (G6 - F2 * 0.25) / 2;    // (G6 - F2·0.25)/2 (I10..I12)
  const v8 = Math.min(capHalf, H8); const I8 = v8 >= N4 ? v8 : 0;
  const I9 = H9 >= N4 ? H9 : 0;
  const v10 = Math.min(cap25, H10); const I10 = xtrunc(v10 >= N4 ? v10 : 0, 2);
  const v11 = Math.min(cap25, H11); const I11 = xtrunc(v11 >= N4 ? v11 : 0, 0);
  const v12 = Math.min(cap25, H12); const I12 = v12 >= N4 ? v12 : 0;

  const J8 = I8, J9 = I9, J10 = I10;
  const j11v = (J10 + I11) < cap25 ? I11 : (cap25 - J10);
  const J11 = j11v >= N4 ? j11v : 0;
  const j12v = (J10 + I12 + J11) < cap25 ? I12 : (cap25 - J10 - J11);
  const J12 = (j12v > F12 * N6 && j12v >= N4) ? j12v : 0;

  const J13 = J8 + J9 + J10 + J11 + J12;
  return { J13, J14: xrounddown(J13, 2) };
}

// Camino por CAPACIDAD (N7): la letra sale de la capacidad máxima del cliente (J13),
// y el resto del cálculo es idéntico al camino por letra.
function cotizarPorCapacidad(fin            , inp            , cfg                  )              {
  const { J13 } = capacidadQuincenal(fin, inp.clave, inp.esCSS);
  return cotizarPorLetra({ ...inp, letra: J13 }, cfg);
}

// Letra quincenal aplicada en Pago Automático: la solicitada se redondea a dólar entero
// hacia arriba, sin exceder el mínimo entre el tope por salario (F11) y la capacidad (J13).
// Refleja la lógica de la app (enforceTopePagoAuto); alimenta el camino por letra.
function letraAplicadaPagoAuto(
  letraSolicitada        , salario        , esCSS         , capacidadJ13        ,
)         {
  const limite = Math.min(topeLetraPagoAuto(salario, esCSS), capacidadJ13);
  const floorLim = Math.floor(limite);
  const ceilReq = Math.ceil(letraSolicitada - 1e-6);
  return ceilReq <= floorLim ? ceilReq : floorLim;
}

function servicioRate(inp            , cfg                  )         {
  switch (inp.clave) {
    case 'G8': return cfg.servicioRate.G8;
    case 'G9': return cfg.servicioRate.G9;
    case 'G10': return cfg.servicioRate.G10;
    case 'G11': return inp.esCSS ? cfg.servicioRate.G11_CSS : cfg.servicioRate.G11;
    case 'G12': return cfg.servicioRate.G12;
  }
}

const CFG = {"matrizComision":[[0.07,0.036,0.02,0,0],[0.036,0.02,0.01,0,0],[0.036,0.02,0.01,0,0],[0.048,0.036,0.02,0,0],[0.036,0.03,0.02,0,0],[0.05,0.036,0.02,0,0]],"matrizInteres":[[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.01,0.01,0.01,0.01,0.01]],"matrizGastoCierre":[[0.1,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.35,0.35,0.35,0.35,0.35]],"matrizComisionVol":[[0.048,0.036,0.02,0,0],[0.036,0.02,0.01,0,0],[0.036,0.02,0.01,0,0],[0.048,0.036,0.02,0,0],[0.036,0.03,0.02,0,0],[0.048,0.036,0.02,0,0]],"matrizInteresVol":[[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02],[0.02,0.02,0.02,0.02,0.02]],"matrizGastoCierreVol":[[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25,0.25],[0.50743,0.45,0.38,0.25,0.38]],"itbmsRate":0.07,"timbresRate":0.001,"feciRate":0.01,"notaria":25,"amCap":144,"servicioRate":{"G8":0.03,"G9":0,"G10":0.03,"G11_CSS":0.06,"G11":0.06,"G12":0},"tipoMaxPlazo":[300,300,84,72,36,60,11],"jubilaAplica":true,"edadJubMujer":57,"edadJubHombre":62};
const TIPO_NOMBRES = {"1":"Diamante","2":"Platinum","3":"Premium","4":"24-59 meses","5":"0-23 meses","6":"Recien Nombrado","7":"Eventual"};

// ======================= INTERFAZ =======================
const $ = id => document.getElementById(id);
const money = v => '$' + (Number(v)||0).toLocaleString('es-PA',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (Number(v)*100).toLocaleString('es-PA',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';

// poblar tipos de cliente
const selTipo = $('tipo');
for(let c=1;c<=7;c++){ const o=document.createElement('option'); o.value=c; o.textContent=c+' · '+TIPO_NOMBRES[c]; selTipo.appendChild(o); }
selTipo.value = 3;

function serial(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000); }
function hoySerial(){ const d=new Date(); return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); }

function toggles(){
  const modo=$('modo').value;
  $('f_monto').classList.toggle('hide', modo!=='monto');
  $('f_letra').classList.toggle('hide', modo!=='letra');
  $('f_cliente').classList.toggle('hide', modo!=='capacidad');
  $('f_jub').classList.toggle('hide', !$('jub').checked);
}

function calcular(){
  toggles();
  const modo=$('modo').value;
  const inp={
    plazo:+$('plazo').value, tipoCode:+$('tipo').value, promotorIdx:+$('prom').value,
    promotorNoTiene:false, clave:$('clave').value, esCSS:$('esCSS').checked,
    refi:+$('refi').value, terceros:+$('terceros').value,
    itbmsFuera:$('af1').checked, interesCompuesto:$('af10').checked,
    fnacSerial: serial($('fnac').value), genero:$('genero').value, todaySerial: hoySerial(),
  };
  if(!$('jub').checked){ inp.fnacSerial = hoySerial() - 25*365; } // sin tope: cliente joven

  let r;
  if(modo==='monto'){ inp.monto=+$('monto').value; r=cotizarPorMonto(inp,CFG); }
  else if(modo==='letra'){ inp.letra=+$('letra').value; r=cotizarPorLetra(inp,CFG); }
  else {
    const fin={ salario:+$('c_sal').value, descComercial:+$('c_desc').value, claveN147:+$('c_n147').value,
                embargos:+$('c_emb').value, descontable:+$('c_descontable').value };
    r=cotizarPorCapacidad(fin,inp,CFG);
  }

  $('r_letra').textContent = money(r.letraQuincenal);
  $('r_cuotas').textContent = r.cuotas + ' cuotas · ' + (r.cuotas*2) + ' quincenas';
  const rows = [
    ['mayor','Monto Total de Obligación', r.totalPagar],
    ['','Menos Intereses', r.interes],
    ['','Gastos Notariales', r.notaria],
    ['','FECI', r.feci],
    ['','ITBMS', r.itbms],
    ['','Servicio de Descuento', r.servicioDescuento],
    ['','Comisión Promotor', r.comisionPromotor],
    ['','Comisión Administrativa', r.comisionAdmin],
    ['','Timbres', r.timbres],
    ['mayor','Monto Obligación Neta', r.montoNeta],
    ['','Menos Refinanciamiento', inp.refi||0],
    ['','Cancelación a Terceros', inp.terceros||0],
    ['fin','Monto Recibido en Mano', r.sumaARecibir],
  ];
  $('r_tabla').innerHTML = rows.map(([cls,l,v])=>'<tr class="'+cls+'"><td>'+l+'</td><td class="v">'+money(v)+'</td></tr>').join('');
  $('r_tasas').innerHTML =
    '<span>Interés mensual: <b>'+pct(r.tasaInteresMensual)+'</b></span>'+
    '<span>Comisión admin: <b>'+pct(r.tasaComAdmin)+'</b></span>'+
    '<span>Comisión promotor: <b>'+pct(r.tasaComPromotor)+'</b></span>'+
    '<span>Servicio: <b>'+pct(r.tasaServicio)+'</b></span>';
}

document.querySelectorAll('input,select').forEach(el=>{ el.addEventListener('input',calcular); el.addEventListener('change',calcular); });
calcular();
</script>
